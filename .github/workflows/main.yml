name: main

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  USERNAME: ${{ github.repository_owner }}

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Create output directories
        run: mkdir -p assets/generated assets/cached

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ env.USERNAME }}
          outputs: assets/generated/snake.svg?palette=tokyonight

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ env.USERNAME }}&show_icons=true&theme=tokyonight&hide_border=true"
          path: assets/generated/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ env.USERNAME }}&langs_count=20&exclude_repo=0,${{ env.USERNAME }}&layout=compact&theme=tokyonight&hide_border=true"
          path: assets/generated/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache external badge SVGs
        env:
          ASSETS_CACHED: assets/cached
        run: |
          curl -sfL "https://img.shields.io/badge/YouTube-FF0000?style=for-the-badge&logo=youtube&logoColor=white" \
            -o "$ASSETS_CACHED/ic_yt.svg"
          curl -sfL "https://img.shields.io/badge/Ko--fi-F16061?style=for-the-badge&logo=ko-fi&logoColor=white" \
            -o "$ASSETS_CACHED/ic_ko-fi.svg"
          curl -sfL "https://streak-stats.demolab.com?user=$USERNAME&theme=tokyonight&hide_border=true" \
            -o "$ASSETS_CACHED/streak.svg"

      - name: Commit and push generated assets
        run: |
          git add assets/generated/* assets/cached/*
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update assets [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old workflow runs (keep newest 2)
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'main.yml',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs.slice(2)) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
